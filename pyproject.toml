[build-system]
requires = ["setuptools>=39.1.0", "wheel", "Cython>=0.29.24", "numpy>=2.0.0", "versioneer"]
build-backend = "setuptools.build_meta"

[tool.cython]
language_level = "3"

[tool.versioneer]
VCS = "git"
style = "pep440"
versionfile_source = "x_filter/_version.py"
versionfile_build = "x_filter/_version.py"
tag_prefix = "v"
parentdir_prefix = "x-filter-"

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | x_filter/_version.py
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov=x_filter --cov-report=xml --cov-report=term"