[tox]
envlist = py38, py39, py310, py311
isolated_build = True

[testenv]
deps =
    pytest>=7.0.0
    pytest-cov>=4.0.0
commands =
    pytest {posargs:tests} --cov=x_filter --cov-report=term --cov-report=xml

[testenv:lint]
deps =
    black>=23.0.0
    flake8>=6.0.0
    isort>=5.12.0
    mypy>=1.0.0
commands =
    black --check x_filter tests
    isort --check x_filter tests
    flake8 x_filter tests
    mypy x_filter

[testenv:docs]
deps =
    sphinx>=6.0.0
    sphinx-rtd-theme>=1.2.0
commands =
    sphinx-build -b html docs/source docs/build/html